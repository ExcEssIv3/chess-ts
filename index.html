<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>chess</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css"
    />
    <style>
      #board-wrapper {
        width: 400px;
        margin: 40px auto;
        position: relative;
      }
      #board {
        transition: transform 0.15s ease-in, opacity 0.15s ease-in;
      }
      /* chessboard.js drags pieces via touch events without calling
         preventDefault, so without this the browser's native scroll
         gesture fires at the same time as a drag on touch devices. */
      #board .square-55d63,
      #board .piece-417db {
        touch-action: none;
      }
      #board.flipping {
        transform: rotateY(90deg);
        opacity: 0;
      }
      #promotion-picker {
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 4px;
        background: #fff;
        border: 1px solid #ccc;
        border-radius: 6px;
        padding: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
        z-index: 10;
      }
      #promotion-picker.hidden {
        display: none;
      }
      #promotion-picker button {
        width: 44px;
        height: 44px;
        padding: 2px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
      }
      #promotion-picker button img {
        width: 100%;
        height: 100%;
      }
      .captures-row {
        width: 400px;
        margin: 0 auto;
        min-height: 26px;
        display: flex;
        align-items: center;
        gap: 2px;
        font-family: sans-serif;
        font-size: 13px;
      }
      .captured-piece {
        width: 20px;
        height: 20px;
      }
      .captured-advantage {
        margin-left: 6px;
        font-weight: bold;
        color: #2e7d32;
      }
      #reset-button {
        display: block;
        margin: 0 auto 20px;
      }
      #controls {
        width: 400px;
        margin: 0 auto 20px;
        display: flex;
        justify-content: center;
        gap: 16px;
        font-family: sans-serif;
        font-size: 14px;
      }
      #fen-form {
        width: 400px;
        margin: 0 auto 20px;
        display: flex;
        gap: 8px;
        font-family: sans-serif;
        font-size: 14px;
      }
      #fen-input {
        flex: 1;
        font-family: monospace;
        font-size: 13px;
      }
      #engine-status {
        width: 400px;
        margin: 0 auto;
        text-align: center;
        font-family: sans-serif;
        font-size: 13px;
        color: #666;
        min-height: 1.2em;
      }
      #debug-panel {
        width: 400px;
        margin: 0 auto 20px;
        font-family: monospace;
        font-size: 13px;
        border-collapse: collapse;
      }
      #debug-panel td {
        padding: 2px 8px;
        border: 1px solid #ccc;
      }
      #debug-panel td:first-child {
        font-weight: bold;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <button id="reset-button" type="button">Reset Board</button>
    <div id="controls">
      <label><input type="checkbox" id="engine-toggle" checked /> Engine enabled</label>
      <label id="side-select-label">
        Play as:
        <select id="side-select">
          <option value="w">White</option>
          <option value="b">Black</option>
        </select>
      </label>
      <label id="movetime-select-label">
        Think time (ms):
        <input type="number" id="movetime-input" value="1000" min="100" step="100" />
      </label>
    </div>
    <form id="fen-form">
      <input type="text" id="fen-input" placeholder="Paste a FEN string..." autocomplete="off" />
      <button type="submit">Load FEN</button>
    </form>
    <div id="engine-status"></div>
    <div id="captures-by-black" class="captures-row"></div>
    <div id="board-wrapper">
      <div id="board"></div>
      <div id="promotion-picker" class="hidden">
        <button type="button" data-piece="q"><img alt="Queen" /></button>
        <button type="button" data-piece="r"><img alt="Rook" /></button>
        <button type="button" data-piece="b"><img alt="Bishop" /></button>
        <button type="button" data-piece="n"><img alt="Knight" /></button>
        <button type="button" id="promotion-cancel">✕</button>
      </div>
    </div>
    <div id="captures-by-white" class="captures-row"></div>
    <table id="debug-panel">
      <tbody>
        <tr><td>Turn</td><td id="debug-turn"></td></tr>
        <tr><td>Castling</td><td id="debug-castling"></td></tr>
        <tr><td>En passant</td><td id="debug-en-passant"></td></tr>
        <tr><td>Halfmove clock</td><td id="debug-halfmove"></td></tr>
        <tr><td>Fullmove number</td><td id="debug-fullmove"></td></tr>
        <tr><td>FEN</td><td id="debug-fen"></td></tr>
      </tbody>
    </table>
    <script
      src="https://code.jquery.com/jquery-3.7.1.min.js"
      integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
      crossorigin="anonymous"
    ></script>
    <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
