name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      # A freshly-installed SDK's bundled workload manifests can be stale
      # relative to its exact feature band, which silently no-ops the
      # wasm-tools install below (dotnet publish then falls back to an
      # unoptimized, non-wasm build with no error, just a warning) —
      # `workload update` refreshes the manifests for the SDK that was
      # just installed before `workload install` runs.
      - run: dotnet workload update
      - run: dotnet workload install wasm-tools
      - run: dotnet workload list
      - run: npm ci
      # `npm run build` runs `build:engine-cs` first (dotnet publish the
      # engine-cs/ WASM engine into public/dotnet-engine/) before the
      # TS build, so the wasm-tools workload above must be in place first.
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
